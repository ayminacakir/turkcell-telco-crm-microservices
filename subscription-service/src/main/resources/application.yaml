server:
    port: 9005

spring:
    application:
        name: subscription-service
    profiles:
        active: dev
    config:
        import: optional:configserver:http://localhost:8888
    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    flyway:
        baseline-on-migrate: true

# Tek makinede (localhost) calisan gelistirme/demo ortami icin: servisler Eureka'ya
# 'localhost' olarak kaydolur. Boylece Mac'in IP'si (Wi-Fi/hotspot) degisse bile
# gateway lb:// ile servislere her zaman ulasir. Coklu-makine kurulumunda kaldirin.
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
