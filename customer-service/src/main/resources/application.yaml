server:
    port: 9002

app:
    security:
        pii-encryption-key: w1gBKCjM1rwjpgZIgtakU19gqQU4h7RIG4309dzu5vw=

spring:
    application:
        name: customer-service
    profiles:
        active: dev
    config:
        import: optional:configserver:http://localhost:8888
    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
    flyway:
        baseline-on-migrate: true
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8085/realms/telco-crm

# Tek makinede (localhost) calisan gelistirme/demo ortami icin: servisler Eureka'ya
# 'localhost' olarak kaydolur. Boylece Mac'in IP'si (Wi-Fi/hotspot) degisse bile
# gateway lb:// ile servislere her zaman ulasir. Coklu-makine kurulumunda kaldirin.
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
