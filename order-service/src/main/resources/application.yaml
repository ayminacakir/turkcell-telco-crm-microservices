server:
    port: 9004

spring:
    application:
        name: order-service
    profiles:
        active: dev
    config:
        import: optional:configserver:http://localhost:8888
    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    flyway:
        baseline-on-migrate: true
    cloud:
        openfeign:
            circuitbreaker:
                enabled: true

resilience4j:
    circuitbreaker:
        instances:
            customer-service:
                sliding-window-size: 10
                failure-rate-threshold: 50
            product-catalog-service:
                sliding-window-size: 10
                failure-rate-threshold: 50

# Tek makinede (localhost) calisan gelistirme/demo ortami icin: servisler Eureka'ya
# 'localhost' olarak kaydolur. Boylece Mac'in IP'si (Wi-Fi/hotspot) degisse bile
# gateway lb:// ile servislere her zaman ulasir. Coklu-makine kurulumunda kaldirin.
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
