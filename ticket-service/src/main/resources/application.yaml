server:
  port: 9009

spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: ticket_service
