server:
  port: 9010

spring:
  application:
    name: ticket-service
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: ticket_service
    default-schema: ticket_service
    baseline-on-migrate: true
